<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Démos — sites réalisés pour des entreprises</title>
<meta name="description" content="Sites de démonstration conçus pour des entreprises : e-commerce, vitrines, landing pages. Ouvrez une démo pour voir le rendu sur mobile et ordinateur.">
<meta property="og:title" content="Démos — sites réalisés pour des entreprises">
<meta property="og:description" content="Ouvrez une démo pour voir le rendu sur mobile et ordinateur.">
<meta name="theme-color" content="#0a0a0d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root {
    color-scheme: dark;
    --bg: #0a0a0d;
    --surface: #141418;
    --line: rgba(242, 239, 232, 0.1);
    --text: #f2efe8;
    --muted: #a3a0aa;
    --faint: #6f6c78;
    --iri: linear-gradient(100deg, #e8b84a 0%, #ff5a1f 32%, #9b6bff 66%, #2fd3e6 100%);
    --f-ui: "Bricolage Grotesque", "Helvetica Neue", Arial, system-ui, sans-serif;
    --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--f-ui); line-height: 1.5; -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  .wrap { max-width: 1240px; margin-inline: auto; padding-inline: clamp(16px, 4vw, 48px); }
  header.top { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding-block: 22px; }
  .brand { font-weight: 800; font-size: 1.3rem; letter-spacing: -0.03em; font-stretch: 85%; text-decoration: none; }
  .top a.link { color: var(--muted); text-decoration: none; font-size: 0.95rem; }
  .top a.link:hover { color: var(--text); }
  .hero { padding-block: clamp(48px, 10vw, 110px) clamp(32px, 6vw, 64px); }
  .eyebrow { font-family: var(--f-mono); font-size: 0.78rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
  h1 { margin: 16px 0 0; font-size: clamp(2.6rem, 8vw, 6.4rem); line-height: 0.92; font-weight: 700; font-stretch: 80%; letter-spacing: -0.045em; text-wrap: balance; }
  h1 em { font-style: normal; background: var(--iri); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .lead { max-width: 36rem; margin: 22px 0 0; color: var(--muted); font-size: clamp(1rem, 1.4vw, 1.15rem); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; padding: 0; margin: 0; list-style: none; }
  .card { display: grid; height: 100%; border-radius: 22px; overflow: hidden; background: var(--surface); border: 1px solid var(--line); text-decoration: none; transition: transform 0.4s cubic-bezier(0.22, 0.9, 0.3, 1), border-color 0.3s; }
  .card:hover { transform: translateY(-4px); border-color: rgba(242, 239, 232, 0.28); }
  .card:focus-visible { outline: 2px solid #e8b84a; outline-offset: 3px; }
  .swatch { height: 140px; background: var(--c, #333); position: relative; }
  .swatch::after { content: ""; position: absolute; inset: 0; background: linear-gradient(160deg, rgba(255,255,255,0.18), transparent 55%); }
  .body { display: grid; gap: 6px; padding: 18px 20px 20px; }
  .meta { font-family: var(--f-mono); font-size: 0.74rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .title { font-size: 1.35rem; font-weight: 700; line-height: 1.15; letter-spacing: -0.02em; }
  .go { margin-top: 6px; color: var(--muted); font-size: 0.92rem; }
  .card:hover .go { color: var(--text); }
  .empty { padding: 48px 24px; border: 1px dashed var(--line); border-radius: 22px; text-align: center; color: var(--muted); }
  .cta { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 20px; margin-block: clamp(56px, 10vw, 110px) 40px; padding: clamp(24px, 4vw, 40px); border-radius: 26px; background: var(--surface); border: 1px solid var(--line); }
  .cta p { margin: 0; font-size: clamp(1.3rem, 2.6vw, 2rem); font-weight: 700; letter-spacing: -0.02em; max-width: 30ch; }
  .btn { display: inline-flex; padding: 14px 22px; border-radius: 99px; background: var(--iri); color: #0a0a0d; font-weight: 700; text-decoration: none; white-space: nowrap; }
  footer { padding-block: 24px 40px; color: var(--faint); font-size: 0.85rem; }
  @media (prefers-reduced-motion: reduce) { .card { transition: none; } }
</style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <a class="brand" id="brand" href="./">Studio</a>
      <a class="link" id="portfolio" href="#" target="_blank" rel="noopener">Portfolio ↗</a>
    </header>

    <section class="hero">
      <p class="eyebrow">Démos</p>
      <h1>Des sites pensés pour <em>vendre</em>.</h1>
      <p class="lead">Chaque démo est un site complet, conçu pour une activité précise. Ouvrez-en une sur votre téléphone : c'est là que vos clients la verront.</p>
    </section>

    <ul class="grid" id="grid" aria-label="Démos"></ul>

    <section class="cta">
      <p>Un site comme celui-ci pour votre activité ?</p>
      <a class="btn" id="wa" href="#" target="_blank" rel="noopener">Écrire sur WhatsApp</a>
    </section>

    <footer>© <span id="year"></span> <span id="brand-foot">Studio</span></footer>
  </div>

<script>
  (async () => {
    const $ = (s) => document.querySelector(s);
    $("#year").textContent = new Date().getFullYear();
    let data = { studio: {}, demos: [] };
    try {
      const res = await fetch("./demos.json", { cache: "no-store" });
      if (res.ok) data = await res.json();
    } catch (e) { /* galerie vide */ }

    const s = data.studio || {};
    if (s.name) { $("#brand").textContent = s.name; $("#brand-foot").textContent = s.name; }
    if (s.portfolio) $("#portfolio").href = s.portfolio; else $("#portfolio").hidden = true;
    const msg = encodeURIComponent("Bonjour, j'ai vu vos démos. Je voudrais un site pour mon activité.");
    if (s.whatsapp) $("#wa").href = "https://wa.me/" + String(s.whatsapp).replace(/\D/g, "") + "?text=" + msg;
    else $("#wa").hidden = true;

    const grid = $("#grid");
    const list = (data.demos || []).filter((d) => d && d.slug && d.public !== false);
    if (!list.length) {
      const li = document.createElement("li");
      li.className = "empty";
      li.textContent = "Les premières démos arrivent bientôt.";
      grid.append(li);
      return;
    }
    for (const d of list) {
      const li = document.createElement("li");
      const a = document.createElement("a");
      a.className = "card";
      a.href = "./" + encodeURIComponent(d.slug) + "/";
      const sw = document.createElement("div");
      sw.className = "swatch";
      if (/^#[0-9a-f]{3,8}$/i.test(d.color || "")) sw.style.setProperty("--c", d.color);
      const body = document.createElement("div");
      body.className = "body";
      const meta = document.createElement("span");
      meta.className = "meta";
      meta.textContent = [d.sector, d.city].filter(Boolean).join(" · ");
      const title = document.createElement("span");
      title.className = "title";
      title.textContent = d.title || d.slug;
      const go = document.createElement("span");
      go.className = "go";
      go.textContent = "Voir la démo →";
      body.append(meta, title, go);
      a.append(sw, body);
      li.append(a);
      grid.append(li);
    }
  })();
</script>
</body>
</html>
