<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- Hooked Academy : le monogramme de Hooked Lab (deux piliers + deux barres courtes)
       dont la barre du milieu se redresse en chevron. Le H reste, il « monte d'un niveau ». -->
  <defs>
    <linearGradient id="ha-or" gradientUnits="userSpaceOnUse" x1="0" y1="9" x2="0" y2="39">
      <stop offset="0" stop-color="#f2dfa0"/>
      <stop offset="1" stop-color="#b08a24"/>
    </linearGradient>
  </defs>
  <g fill="url(#ha-or)">
    <rect x="8.5" y="9" width="5.5" height="30" rx="2.75"/>
    <rect x="34" y="9" width="5.5" height="30" rx="2.75"/>
  </g>
  <path d="M19.4 29.2 24 18.8 28.6 29.2" fill="none" stroke="url(#ha-or)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
