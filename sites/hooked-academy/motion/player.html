<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lecteur — Hooked Academy</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Figtree:wght@400..800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@400..700&display=swap">
<link rel="stylesheet" href="../assets/css/brand.css">
<link rel="stylesheet" href="./motion.css">
<link rel="stylesheet" href="./player.css">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<script type="module" src="./player.js"></script>
</head>
<body>
<main class="pl" id="pl">
  <div class="pl-stage" id="stage"></div>
  <button class="pl-big" id="big" type="button" aria-label="Lire la vidéo">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7Z"/></svg>
  </button>
  <div class="pl-tele" id="tele" hidden><span class="pl-tele-k">À dire</span><p id="tele-txt"></p></div>
  <div class="pl-bar" id="bar">
    <button class="pl-btn" id="play" type="button" aria-label="Lecture"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="i-play" d="M8 5v14l11-7Z"/><path class="i-pause" d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg></button>
    <span class="pl-time" id="time">00:00</span>
    <input class="pl-seek" id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Position dans la vidéo">
    <span class="pl-time" id="dur">00:00</span>
    <button class="pl-btn pl-speed" id="speed" type="button" aria-label="Vitesse de lecture">1×</button>
    <button class="pl-btn" id="fs" type="button" aria-label="Plein écran"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
  </div>
</main>
</body>
</html>
