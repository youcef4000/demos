<body class="page-light page-catalogue">
<a class="skip" href="#main" data-t="common.skip">Aller au contenu</a>
<header class="hdr hdr--dark" id="hdr"></header>
<main id="main">
  <section class="cat-hero" data-hdr="light">
    <div class="wrap">
      <p class="kicker" data-t="catalogue.kicker">Catalogue</p>
      <h1 class="h1" data-t-rich="catalogue.title" data-split>Le catalogue <em>Algerian Product</em>.</h1>
      <p class="lead" data-t="catalogue.lead">Filtrez par filière ou par région, ouvrez une fiche et ajoutez les produits qui vous intéressent à votre demande de devis.</p>
    </div>
  </section>
  <section class="cat" data-hdr="light">
    <div class="wrap">
      <div class="cat__bar" id="cat-bar">
        <label class="search"><span data-icon="search"></span><input type="search" id="cat-q" data-t-attr="placeholder:catalogue.search;aria-label:catalogue.search" autocomplete="off"></label>
        <select class="select" id="cat-region" data-t-attr="aria-label:nav.regions"></select>
      </div>
      <div class="chips" id="cat-chips" role="toolbar"></div>
      <p class="cat__count" id="cat-count" aria-live="polite"></p>
      <div class="cards cat__grid" id="cat-grid"></div>
      <p class="cat__empty" id="cat-empty" data-t="catalogue.empty" hidden></p>
      <p class="cat__note" data-t="catalogue.note"></p>
    </div>
  </section>
</main>
<footer class="ftr" id="ftr"></footer>
<a class="basket" id="basket" href="devis.html" hidden></a>
</body>
</html>
