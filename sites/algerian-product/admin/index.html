<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Espace admin — Algerian Product</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0c1110">
<link rel="icon" href="../img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..500&family=Inter+Tight:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Kufi+Arabic:wght@400..700&display=swap">
<link rel="stylesheet" href="./admin.css">
<script type="module" src="./admin.js"></script>
</head>
<body>
<div class="login" id="login" hidden>
  <form class="login__card" id="login-form">
    <div class="login__mark" id="login-mark"></div>
    <h1>Algerian Product</h1>
    <p>Espace d’administration</p>
    <label class="f"><span>Mot de passe</span><input type="password" name="pw" autocomplete="current-password" autofocus></label>
    <p class="login__err" id="login-err" aria-live="polite"></p>
    <button class="b b--primary b--full" type="submit">Entrer</button>
    <p class="login__hint">Démo : mot de passe <code>algerian</code></p>
  </form>
</div>

<div class="app" id="app" hidden>
  <aside class="side" id="side">
    <a class="side__brand" href="../" target="_blank" rel="noopener"><span id="side-mark"></span><span>Algerian<br><b>Product</b></span></a>
    <nav class="side__nav" id="nav"></nav>
    <div class="side__foot">
      <a href="../" target="_blank" rel="noopener">Voir le site ↗</a>
      <button type="button" id="logout">Se déconnecter</button>
    </div>
  </aside>
  <div class="main">
    <header class="top">
      <button class="top__menu" type="button" id="menu-btn" aria-label="Menu">☰</button>
      <h1 class="top__title" id="view-title"></h1>
      <div class="top__lang" id="edit-lang" title="Langue d’édition des textes"></div>
      <div class="top__actions">
        <span class="pubstate" id="pubstate"></span>
        <a class="b b--ghost" id="preview" href="../?preview=1" target="_blank" rel="noopener">Aperçu</a>
        <button class="b b--primary" type="button" id="publish">Publier</button>
      </div>
    </header>
    <section class="view" id="view"></section>
  </div>
</div>
<div class="drawer" id="drawer" hidden><div class="drawer__bg" data-close></div><div class="drawer__panel" role="dialog" aria-modal="true"><div class="drawer__head"><h2 id="drawer-title"></h2><button class="drawer__x" type="button" data-close aria-label="Fermer">✕</button></div><div class="drawer__body" id="drawer-body"></div></div></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
</body>
</html>
