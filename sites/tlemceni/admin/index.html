<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tlemceni — espace admin</title>
<meta name="description" content="Espace d'administration du site Tlemceni : textes en français, arabe et anglais, coloris de la basket 3D, photos, chiffres, boutiques et liens.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0e0e0f">
<meta property="og:title" content="Tlemceni — espace admin">
<meta property="og:description" content="Changer un texte, une photo, un coloris ou un numéro WhatsApp, puis publier : l'espace d'administration du site Tlemceni.">
<meta property="og:image" content="https://demos.bornzstudio.com/tlemceni/img/og.jpg">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%230b0b0c' stroke='%23d21f2b' stroke-width='4'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-family='Arial Black,Arial' font-weight='900' font-size='26' fill='%23f3efe8'%3E13%3C/text%3E%3Cpath d='M22 17l4 3 6-6 6 6 4-3v6H22z' fill='%23d8b56a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,300..800;1,62..125,300..800&family=IBM+Plex+Mono:wght@400;500&family=Aref+Ruqaa:wght@400&family=Rakkas&display=swap">
<link rel="stylesheet" href="./admin.css">
<script type="module" src="./admin.js"></script>
</head>
<body>

<!-- ============ CONNEXION ============ -->
<section class="login" id="login" hidden>
  <form class="login__card" id="login-form">
    <svg class="login__logo brand-seal" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18.5"/><path d="M13 12.5l3 2.2 4-4.4 4 4.4 3-2.2v4.2H13z"/><text x="20" y="30">13</text></svg>
    <p class="mono login__kicker">Espace admin</p>
    <h1 class="login__title">Tlemceni</h1>
    <p class="login__ar" lang="ar">التلمساني</p>
    <label class="f">
      <span class="f__label">Mot de passe</span>
      <input type="password" id="login-pass" autocomplete="current-password" required>
    </label>
    <p class="login__err" id="login-err" role="alert"></p>
    <button class="b b--accent b--block" type="submit">Entrer</button>
    <p class="login__hint">Démo : le mot de passe est <b>tlemceni</b>. En production, chaque membre de l'équipe a son propre compte.</p>
  </form>
  <a class="login__back" href="../">← Retour au site</a>
</section>

<!-- ============ ADMIN ============ -->
<div class="app" id="app" hidden>
  <aside class="side" id="side">
    <a class="side__brand" href="../" target="_blank" rel="noopener">
      <svg class="brand-seal" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18.5"/><path d="M13 12.5l3 2.2 4-4.4 4 4.4 3-2.2v4.2H13z"/><text x="20" y="30">13</text></svg>
      <span><b>Tlemceni</b><small class="mono">Admin</small></span>
    </a>
    <nav class="side__nav" id="side-nav" aria-label="Rubriques">
      <button type="button" data-view="textes"><i>01</i>Textes du site</button>
      <button type="button" data-view="basket"><i>02</i>La basket 3D</button>
      <button type="button" data-view="coloris"><i>03</i>Coloris<em id="count-cw"></em></button>
      <button type="button" data-view="photos"><i>04</i>Photos</button>
      <button type="button" data-view="communaute"><i>05</i>Chiffres</button>
      <button type="button" data-view="boutiques"><i>06</i>Boutiques<em id="count-stores"></em></button>
      <button type="button" data-view="evenement"><i>07</i>Événement</button>
      <button type="button" data-view="liens"><i>08</i>Liens &amp; WhatsApp</button>
      <button type="button" data-view="sauvegarde"><i>09</i>Sauvegarde</button>
    </nav>
    <div class="side__foot">
      <a class="side__link" href="../" target="_blank" rel="noopener">Voir le site ↗</a>
      <button class="side__link" type="button" id="logout">Se déconnecter</button>
    </div>
  </aside>

  <main class="main">
    <header class="top">
      <div class="top__title">
        <p class="mono top__crumb" id="crumb">Contenu</p>
        <h1 id="view-title">Textes du site</h1>
      </div>
      <div class="langtabs" role="group" aria-label="Langue des textes">
        <button type="button" data-lang="fr" aria-pressed="true">FR</button>
        <button type="button" data-lang="ar" aria-pressed="false" lang="ar">عربي</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
      <p class="status" id="status" role="status"><i></i><span>À jour</span></p>
      <div class="top__actions">
        <button class="b b--ghost top__preview-btn" type="button" id="toggle-preview">Aperçu</button>
        <button class="b b--accent" type="button" id="publish">Publier</button>
      </div>
    </header>
    <div class="view" id="view"></div>
  </main>

  <aside class="preview" id="preview" aria-label="Aperçu du site">
    <div class="preview__bar">
      <p class="mono">Aperçu en direct</p>
      <div class="seg" role="group" aria-label="Taille de l'aperçu">
        <button type="button" data-device="mobile" aria-pressed="true">Mobile</button>
        <button type="button" data-device="desktop" aria-pressed="false">Ordinateur</button>
      </div>
      <button class="preview__close" type="button" id="close-preview" aria-label="Fermer l'aperçu">×</button>
    </div>
    <div class="preview__stage" id="preview-stage">
      <div class="preview__frame" id="preview-frame">
        <iframe id="frame" title="Aperçu du site" src="about:blank"></iframe>
      </div>
    </div>
  </aside>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<dialog class="confirm" id="confirm">
  <form method="dialog">
    <p id="confirm-text"></p>
    <div class="confirm__actions">
      <button class="b b--ghost" value="cancel">Annuler</button>
      <button class="b b--danger" value="ok" id="confirm-ok">Confirmer</button>
    </div>
  </form>
</dialog>
</body>
</html>
