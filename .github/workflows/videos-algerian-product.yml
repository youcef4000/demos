# Vidéos du film « Algerian Product » : téléchargées une fois depuis Pexels / Wikimedia Commons,
# réencodées en H.264 (1080p et 720p, démarrage rapide) puis servies par le site lui-même.
# Se relance quand sites/algerian-product/video/sources.json change.
name: Vidéos algerian-product

on:
  push:
    branches: [main]
    paths: ['sites/algerian-product/video/sources.json', '.github/workflows/videos-algerian-product.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: videos-algerian-product
  cancel-in-progress: false

jobs:
  encode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg jq
      - name: Télécharger et réencoder
        working-directory: sites/algerian-product/video
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36'
          echo '{}' > manifest.next.json
          for row in $(jq -c '.clips[]' sources.json); do
            key=$(jq -r .key <<<"$row"); src=$(jq -r .src <<<"$row"); t=$(jq -r '.t // 12' <<<"$row")
            echo "::group::$key  $src"
            if ! curl -sSfL --retry 3 -A "$UA" -o "/tmp/$key.src" "$src"; then echo "::warning::$key : téléchargement impossible"; echo "::endgroup::"; continue; fi
            ffprobe -v error -select_streams v:0 -show_entries stream=width,height,r_frame_rate,duration -of csv=p=0 "/tmp/$key.src" || true
            # Paysage : 1920×1080 (ordinateur) et 1280×720 (téléphone).
            # Portrait : recadrage 16:9 net pour l'ordinateur, vertical 720×1280 pour le téléphone.
            IFS=x read -r W H < <(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0:s=x "/tmp/$key.src")
            ROT=$(ffprobe -v error -select_streams v:0 -show_entries stream_side_data=rotation -of csv=p=0 "/tmp/$key.src" | head -1 | tr -d '-' || true)
            if [ "${ROT:-0}" = "90" ] || [ "${ROT:-0}" = "270" ]; then t0=$W; W=$H; H=$t0; fi
            if [ "$H" -gt "$W" ]; then
              S1="crop=iw:trunc(iw*9/32)*2,scale='min(1920,iw)':-2:flags=lanczos"
              S2="scale=-2:'min(1280,ih)':flags=lanczos"
            else
              S1="scale=-2:'min(1080,ih)':flags=lanczos"
              S2="scale=-2:'min(720,ih)':flags=lanczos"
            fi
            ffmpeg -nostdin -y -v error -i "/tmp/$key.src" -t "$t" -vf "$S1,fps=30,format=yuv420p" -c:v libx264 -preset slow -crf 20 -maxrate 9M -bufsize 18M -g 60 -profile:v high -movflags +faststart -an "$key-1080.mp4"
            ffmpeg -nostdin -y -v error -i "/tmp/$key.src" -t "$t" -vf "$S2,fps=30,format=yuv420p" -c:v libx264 -preset slow -crf 23 -maxrate 3.5M -bufsize 7M -g 60 -profile:v high -movflags +faststart -an "$key-720.mp4"
            # Affiche = première image de la version qui sera lue sur l'écran le plus courant pour cette source
            if [ "$H" -gt "$W" ]; then P="$key-720.mp4"; else P="$key-1080.mp4"; fi
            ffmpeg -nostdin -y -v error -i "$P" -frames:v 1 -vf "scale=-2:720" -q:v 3 "$key.jpg"
            ls -lh "$key"-*.mp4 "$key.jpg"
            jq --arg src "$src" --arg key "$key" '.[$src] = {hd: ($key + "-1080.mp4"), sd: ($key + "-720.mp4"), poster: ($key + ".jpg")}' manifest.next.json > m.tmp && mv m.tmp manifest.next.json
            rm -f "/tmp/$key.src"
            echo "::endgroup::"
          done
          mv manifest.next.json manifest.json
          cat manifest.json
      - name: Publier les fichiers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898283+github-actions[bot]@users.noreply.github.com'
          git add sites/algerian-product/video
          git diff --cached --quiet && exit 0
          git commit -m "Démo algerian-product : vidéos du film réencodées (1080p / 720p)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          # Un commit du bot ne relance pas les déploiements : on relance le miroir GitHub Pages
          gh workflow run static.yml --ref "${GITHUB_REF_NAME}" || true
        env:
          GH_TOKEN: ${{ github.token }}
