# Publie les démos (dossier sites/) sur GitHub Pages à chaque push sur main : https://demos.bornzstudio.com/<slug>/
# À régler une seule fois : Settings → Pages → Source « GitHub Actions », Custom domain « demos.bornzstudio.com ».
# Hooked Academy n'y est pas : elle a son propre site (https://hooked-academy.tech, servi par le VPS) ;
# les anciens liens /hooked-academy/… y sont renvoyés par sites/404.html.
name: Publier les démos

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - name: Rassembler les démos
        run: cp -a sites _site && rm -rf _site/hooked-academy
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
